name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sqlpilot
          POSTGRES_PASSWORD: sqlpilot
          POSTGRES_DB: sqlpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sqlpilot"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SQLPILOT_TEST_PG_URL: postgresql://sqlpilot:sqlpilot@localhost:5432/sqlpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit + integration tests (Postgres included)
        run: pytest -q -rs
      - name: Quickstart smoke (mock LLM, no keys)
        run: |
          sqlpilot ask --llm mock "How many customers are there?"
          sqlpilot sql "SELECT COUNT(*) FROM Track"
          ! sqlpilot sql "DROP TABLE Track"

  wheel:
    name: Wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/w
          /tmp/w/bin/pip install "$(ls dist/*.whl)[server,mcp]"
          cd /tmp
          /tmp/w/bin/sqlpilot --version
          SQLPILOT_MEMORY_URL=:memory: /tmp/w/bin/sqlpilot ask --llm mock --json "How many albums are there?"
          /tmp/w/bin/python -c "import sqlpilot.api, sqlpilot.mcp_server; print('extras import ok')"

  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sqlpilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the container and hit the API
        run: |
          docker run -d --name sp -p 8000:8000 -e SQLPILOT_LLM=mock -e SQLPILOT_DEMO_API_KEY=ci-demo-key-123 sqlpilot:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && break; sleep 1; done
          curl -fs -H "X-API-Key: ci-demo-key-123" -H "Content-Type: application/json" \
            -d '{"question":"How many artists are there?"}' localhost:8000/v1/ask | tee /tmp/ask.json
          grep -q '"ok":true' /tmp/ask.json
          test "$(docker inspect -f '{{.Config.User}}' sp)" = "sqlpilot"
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' sp)" = "healthy" ] && break; sleep 2; done
          docker inspect -f '{{.State.Health.Status}}' sp | grep -q healthy
      - name: docker compose config
        run: docker compose config -q

  mutation:
    name: Mutation score (testteeth, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: testteeth run --json mutation.json | tee mutation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: |
            mutation.json
            mutation.txt
