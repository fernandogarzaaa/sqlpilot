[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "sqlpilot"
version = "0.1.1"
description = "A multi-agent text-to-SQL analyst (LangGraph): schema retrieval, a read-only SQL guard, self-correction, memory, and a multi-tenant FastAPI + SSE service, MCP server and web UI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Fernando Garza", email = "fernandogarzaaa@gmail.com" }]
keywords = ["text-to-sql", "langgraph", "llm", "agents", "mcp", "fastapi", "sql", "llama.cpp", "spider"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
# Core: the agent, the guard, schema retrieval, SQLite, the CLI `ask`/`bench`.
dependencies = [
    "langgraph>=0.2.50,<2",
    "sqlglot>=25.0,<31",
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
    "opentelemetry-api>=1.24,<2",
    "tomli>=1.1,<3; python_version < '3.11'",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
]
mcp = ["mcp>=1.2,<3"]
postgres = ["psycopg[binary]>=3.1,<4"]
otel = ["opentelemetry-sdk>=1.24,<2", "opentelemetry-exporter-otlp-proto-http>=1.24,<2"]
all = ["sqlpilot[server,mcp,postgres,otel]"]
dev = [
    "sqlpilot[all]",
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.5,<1",
    "mypy>=1.10,<3",
    "build>=1.0,<2",
    "testteeth>=0.2,<1",
]

[project.urls]
Homepage = "https://github.com/fernandogarzaaa/sqlpilot"
Issues = "https://github.com/fernandogarzaaa/sqlpilot/issues"
Changelog = "https://github.com/fernandogarzaaa/sqlpilot/blob/main/CHANGELOG.md"

[project.scripts]
sqlpilot = "sqlpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlpilot"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "bench/*.py", "bench/README.md", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml", "Makefile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "postgres: needs a Postgres server (SQLPILOT_TEST_PG_URL)",
    "llm: needs a live OpenAI-compatible endpoint (SQLPILOT_TEST_LLM_URL)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S608", "B008", "B905", "RUF012", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017", "RUF001"]
"bench/*" = ["S"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false
files = ["src/sqlpilot"]

[[tool.mypy.overrides]]
module = ["sqlglot.*", "langgraph.*", "mcp.*", "psycopg.*", "uvicorn.*", "agentlens.*", "opentelemetry.*", "tomli.*", "tomli"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The MCP server class differs between mcp 1.x and 2.x, so it is typed as Any.
module = ["sqlpilot.mcp_server"]
disallow_untyped_decorators = false

[tool.testteeth]
# Core modules graded by mutation testing (see `make mutation`).
paths = [
    "src/sqlpilot/guard.py",
    "src/sqlpilot/retrieval.py",
    "src/sqlpilot/routing.py",
    "src/sqlpilot/auth.py",
]
test_args = ["tests/test_guard.py", "tests/test_retrieval.py", "tests/test_routing.py", "tests/test_auth.py", "-q", "-x", "-p", "no:cacheprovider"]
